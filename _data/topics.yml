# 아래 배열의 순서가 첫 화면의 주제 순서입니다. id는 글의 topic과 일치시킵니다.
- id: vla
  title: VLA와 로봇 정책
  description: 시각과 언어에서 로봇의 행동으로. 모델 구조, 행동 표현과 학습 과정을 읽습니다.
- id: tactile
  title: 촉각 기반 로봇 학습
  description: 접촉에서 얻는 정보를 이해하고, 시각·촉각을 함께 사용하는 로봇 학습을 살펴봅니다.
- id: interpretability
  title: 해석가능성과 Steering
  description: 모델 내부의 표현을 해석하고, 그 표현에 대한 개입이 행동에 미치는 영향을 살펴봅니다.
